title: Renee
description: 个人网站
lang: zh-CN
author: Renee

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /posts/:year/:month/:title/

defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "", type: posts }
    values: { layout: post }

# 顶部导航，按需增删
nav:
  - { title: 首页, url: / }
  - { title: 文章, url: /posts/ }
  - { title: 关于, url: /about/ }

exclude:
  - README.md
