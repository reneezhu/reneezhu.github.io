title: Renee
description: 个人网站
lang: zh-CN
author: Renee

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /posts/:year/:month/:title/

collections:
  recipes:
    output: true
    permalink: /recipes/:name/

defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: recipes }
    values: { layout: recipe }

# 顶部导航，按需增删
nav:
  - { title: 首页, url: / }
  - { title: 随笔, url: /posts/ }
  - { title: 食谱, url: /recipes/ }
  - { title: 关于, url: /about/ }

exclude:
  - README.md
