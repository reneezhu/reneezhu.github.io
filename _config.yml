title: Renee
description: Renee's notes on tech and baking
lang: en
author: Renee

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /posts/:year/:month/:title/

collections:
  recipes:
    output: true
    permalink: /recipes/:name/

defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: recipes }
    values: { layout: recipe }

# 顶部导航，按需增删
nav:
  - { title: Home,    title_zh: 首页, url: / }
  - { title: Posts,   title_zh: 随笔, url: /posts/ }
  - { title: Recipes, title_zh: 食谱, url: /recipes/ }
  - { title: About,   title_zh: 关于, url: /about/ }

exclude:
  - README.md
